# dsh-login bundle patch: insert the plugin and take over the web runtime.
#
# Applied as a bundle layer when installed via
#   dsh plugin --profile web add github:islibaodong/dsh-login
# (this file is declared in package.json's dsh.bundle.patch).
#
# Identity: dsh-login delegates sign-in to Great Admin SSO. Register the exact
# callback URI `/api/auth/callback` in Great Admin and set publicBaseUrl when
# DSH is reached through a reverse proxy or public tunnel.
#
# IMPORTANT: dsh-login claims the webserver fallback seat (the single
# seat for everything no named route claims). The dsh-web-app bundle's
# `web-runtime` row mounts the frontend-static fallback owner, so that
# row is disabled here; dsh-login re-provides the webRuntime service
# (LAN trust for the /api fence + DSH_WEB_URL) and serves the dist
# itself through the authenticated gateway.

# OPPORTUNITY (option A, DSH ≥ 0.1.5-alpha.1): dsh-login no longer takes over
# the `/api` carrier. The shipped `connection` row (dsh-client-connection)
# stays ENABLED and owns the /api transport + its browser session auth; the
# `api-remotes` / `api-gateway` rows keep feeding the live Remote streams.
# dsh-login instead composes its per-user login wall and ownership layer on
# top of that native stack (see docs/adapt-dsh-0.1.5.md). The gateway below
# (fallback seat) serves the SPA to authenticated users and runs the upstream
# connection.authorizeIndex handshake on index responses, so the browser picks
# up its /api cookie from the enabled connection row.
- insert:
    - id: dsh-login
      name: '@islibaodong/dsh-login'
      config:
        adminBaseUrl: !!js process.env.DUHOME_ADMIN_BASE_URL ?? 'http://127.0.0.1:8080/admin'
        adminClientId: dsh
        publicBaseUrl: !!js process.env.DUHOME_ADMIN_DSH_PUBLIC_URL ?? ''
        # distIndex: '' resolves @deepseek-ai/dsh-web-frontend/dist automatically.
        sessionTtl: 604800
        takeOverWebRuntime: true
        enabled: true

# The web-runtime row's fallback claim conflicts with dsh-login's gateway;
# dsh-login re-provides webRuntime, so disabling it is safe.
- id: web-runtime
  disabled: true
